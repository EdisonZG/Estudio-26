<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time War - Estudio 26</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <style>
        /* Forzar bloqueo visual y orientación horizontal en móviles */
        @media screen and (max-orientation: portrait) {
            body::before {
                content: "Gira tu celular en horizontal 🔄";
                position: fixed;
                top: 0; left: 0; width: 100vw; height: 100vh;
                background: #000;
                color: #00ff66;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: monospace;
                font-size: 1.2rem;
                z-index: 99999;
                text-align: center;
                padding: 20px;
            }
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
            color: #00ff66;
            user-select: none;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 20, 10, 0.85);
            border: 2px solid #00ff66;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }

        #btn-volver {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #000;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            z-index: 20;
            text-decoration: none;
            font-size: 12px;
        }
        #btn-volver:hover {
            background: #00ff66;
            color: #000;
        }

        /* Joystick virtual táctil para movimiento en celular */
        #joystick-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 102, 0.1);
            border: 2px solid rgba(0, 255, 102, 0.4);
            border-radius: 50%;
            z-index: 30;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
            pointer-events: none;
        }

        #instrucciones-tactiles {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff66;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            z-index: 20;
            text-align: right;
        }
    </style>
</head>
<body>

    <a href="../index.html" id="btn-volver">Volver</a>

    <div id="hud">
        <strong>WARRIORS TIME</strong><br>
        Salud: 100/100<br>
        Pos X: <span id="posX">0</span> | Z: <span id="posZ">0</span>
    </div>

    <!-- Joystick táctil para moverse en móvil -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="instrucciones-tactiles">
        Desliza pantalla: Mirar al rededor<br>
        Joystick izq: Moverse por el mapa
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer;
        let moveX = 0, moveZ = 0;
        let touchStartX = 0, touchStartY = 0;
        let cameraLon = 0, cameraLat = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020502);
            scene.fog = new THREE.FogExp2(0x020502, 0.003);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Crear terreno/cuadrícula estilo cyberpunk
            const gridHelper = new THREE.GridHelper(500, 50, 0x00ff66, 0x003311);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const planeGeometry = new THREE.PlaneGeometry(500, 500);
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x010a03, side: THREE.DoubleSide });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = Math.PI / 2;
            plane.position.y = -0.1;
            scene.add(plane);

            // Torres de referencia en el entorno
            const torreGeo = new THREE.CylinderGeometry(2, 4, 60, 8);
            const torreMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true });
            for (let i = -200; i <= 200; i += 100) {
                for (let j = -200; j <= 200; j += 100) {
                    if (i !== 0 || j !== 0) {
                        const torre = new THREE.Mesh(torreGeo, torreMat);
                        torre.position.set(i, 30, j);
                        scene.add(torre);
                    }
                }
            }

            const ambientLight = new THREE.AmbientLight(0x00ff66, 0.4);
            scene.add(ambientLight);

            // Configurar controles táctiles (Joystick + Arrastrar pantalla)
            setupTouchControls();

            window.addEventListener('resize', onWindowResize);
        }

        function setupTouchControls() {
            const joystickContainer = document.getElementById('joystick-container');
            const joystickKnob = document.getElementById('joystick-knob');
            let joystickTouchId = null;

            window.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    // Si toca la mitad izquierda y no hay joystick activo, maneja el movimiento
                    if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                    } else {
                        // Mitad derecha: para mirar alrededor
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        const rect = joystickContainer.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        const centerY = rect.top + rect.height / 2;
                        
                        let dx = touch.clientX - centerX;
                        let dy = touch.clientY - centerY;
                        const distance = Math.hypot(dx, dy);
                        const maxRadius = 40;

                        if (distance > maxRadius) {
                            dx = (dx / distance) * maxRadius;
                            dy = (dy / distance) * maxRadius;
                        }

                        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                        moveX = dx / maxRadius;
                        moveZ = dy / maxRadius;
                    } else {
                        // Rotar cámara deslizando el dedo
                        const deltaX = touch.clientX - touchStartX;
                        const deltaY = touch.clientY - touchStartY;
                        cameraLon -= deltaX * 0.5;
                        cameraLat = Math.max(-85, Math.min(85, cameraLat + deltaY * 0.5));
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        moveX = 0;
                        moveZ = 0;
                        joystickKnob.style.transform = `translate(0px, 0px)`;
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Mover cámara según el joystick virtual
            const speed = 0.8;
            const rad = THREE.MathUtils.degToRad(cameraLon);
            
            const forwardX = Math.sin(rad);
            const forwardZ = -Math.cos(rad);
            const rightX = Math.cos(rad);
            const rightZ = Math.sin(rad);

            camera.position.x += (forwardX * -moveZ + rightX * moveX) * speed;
            camera.position.z += (forwardZ * -moveZ + rightZ * moveX) * speed;

            // Limitar al mapa
            camera.position.x = Math.max(-240, Math.min(240, camera.position.x));
            camera.position.z = Math.max(-240, Math.min(240, camera.position.z));

            // Actualizar rotación de la cámara (Mirar alrededor)
            const phi = THREE.MathUtils.degToRad(90 - cameraLat);
            const theta = THREE.MathUtils.degToRad(cameraLon);

            const target = new THREE.Vector3();
            target.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + 100 * Math.cos(phi);
            target.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);
            camera.lookAt(target);

            // Actualizar HUD
            document.getElementById('posX').innerText = Math.round(camera.position.x);
            document.getElementById('posZ').innerText = Math.round(camera.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
