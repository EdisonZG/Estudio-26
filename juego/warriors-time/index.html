<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warriors Time - Juego 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 16px;
            text-shadow: 0 0 10px #00ff00;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }

        #stats {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            max-width: 300px;
        }

        #stats div {
            margin: 5px 0;
        }

        #healthBar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #00ff00;
            border-radius: 3px;
            overflow: hidden;
            margin: 5px 0;
        }

        #health {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            width: 100%;
            transition: width 0.3s;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 14px;
            max-width: 350px;
        }

        #controls h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }

        .control-item {
            margin: 3px 0;
            font-size: 13px;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            min-width: 400px;
        }

        #endScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }

        #endScreen p {
            font-size: 20px;
            margin: 10px 0;
            color: #00ff00;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #restartBtn:hover {
            background: #00aa00;
            transform: scale(1.05);
        }

        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 18px;
            text-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
    </div>

    <div id="ui">
        <div id="stats">
            <div><strong>⚔️ WARRIORS TIME</strong></div>
            <div>Salud: <span id="healthValue">100</span>/100</div>
            <div id="healthBar">
                <div id="health"></div>
            </div>
            <div id="ammo">Munición: <span id="ammoValue">∞</span></div>
            <div id="level">Nivel: <span id="levelValue">1</span></div>
        </div>
    </div>

    <div class="score">
        <div>🏆 Puntos: <span id="scoreValue">0</span></div>
    </div>

    <div id="controls">
        <h3>Controles</h3>
        <div class="control-item"><strong>W/A/S/D</strong> - Movimiento</div>
        <div class="control-item"><strong>MOUSE</strong> - Apuntar y mirar</div>
        <div class="control-item"><strong>CLICK IZQUIERDO</strong> - Atacar</div>
        <div class="control-item"><strong>ESPACIO</strong> - Saltar</div>
        <div class="control-item"><strong>SHIFT</strong> - Correr</div>
    </div>

    <div id="endScreen">
        <h1 id="endTitle">GAME OVER</h1>
        <p id="endScore">Puntuación Final: 0</p>
        <p id="endLevel">Nivel Alcanzado: 1</p>
        <button id="restartBtn">JUGAR DE NUEVO</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
    <script src="game.js"></script>
</body>
</html>
